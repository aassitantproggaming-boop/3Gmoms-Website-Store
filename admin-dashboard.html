<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - 3Grecep Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 30px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #3498db;
        }

        .new-order-alert {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .orders-table {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        table tr:hover {
            background-color: #f5f5f5;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background-color: #ffeaa7;
            color: #d63031;
        }

        .status-completed {
            background-color: #a9e6a0;
            color: #27ae60;
        }

        .action-btn {
            padding: 8px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-confirm {
            background-color: #27ae60;
            color: white;
        }

        .btn-confirm:hover {
            background-color: #229954;
        }

        .btn-cancel {
            background-color: #e74c3c;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="admin-dashboard.html">📊 Admin Dashboard</a>
        </div>
        <ul class="nav-list">
            <li class="nav-item">
                <a href="admin-dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="index.html">Kembali ke Toko</a>
            </li>
        </ul>
    </nav>

    <div class="admin-container">
        <h1>📊 Dashboard Penjual</h1>

        <!-- STATISTIK -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Total Pesanan</h3>
                <div class="number" id="total-orders">0</div>
            </div>
            <div class="stat-card">
                <h3>Menunggu Konfirmasi</h3>
                <div class="number" id="pending-orders">0</div>
            </div>
            <div class="stat-card">
                <h3>Selesai</h3>
                <div class="number" id="completed-orders">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Pendapatan</h3>
                <div class="number" id="total-revenue">Rp 0</div>
            </div>
        </div>

        <!-- ALERT PESANAN BARU -->
        <div id="new-order-alert"></div>

        <!-- TABEL PESANAN -->
        <div class="orders-table">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Pembeli</th>
                        <th>Produk</th>
                        <th>Total</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <!-- Data akan ditampilkan di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
