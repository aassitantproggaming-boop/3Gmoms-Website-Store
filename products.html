<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - 3Grecep Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">🛒 3Gmoms Store</a>
        </div>
        
        <ul class="nav-list">
            <li class="nav-item">
                <a href="index.html">🏠 Beranda</a>
            </li>
            <li class="nav-item">
                <a href="products.html">📦 Produk</a>
            </li>
            <li class="nav-item">

            </li>
            <li class="nav-item">
                <a href="order-history.html">📋 Riwayat Pembelian</a>
            </li>
        </ul>

        <button class="mobile-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- SEARCH & FILTER -->
    <section class="products-section">
        <div class="products-header">
            <h1>Daftar Produk</h1>
            
            <div class="search-filter">
                <input type="text" id="search-input" placeholder="🔍 Cari produk..." class="search-box">
                
                <select id="category-filter" class="filter-select">
                    <option value="">Semua Kategori</option>
                    <option value="lauk">🍖 Lauk Pauk</option>
                    <option value="snack">🍟 Snack</option>
                    <option value="minuman">🥤 Minuman</option>
                </select>

                <select id="sort-select" class="filter-select">
                    <option value="default">Urutkan</option>
                    <option value="price-low">Harga Terendah</option>
                    <option value="price-high">Harga Tertinggi</option>
                    <option value="name">Nama (A-Z)</option>
                </select>
            </div>
        </div>

        <!-- PRODUK GRID -->
        <div id="products-grid" class="products-grid">
            <!-- Produk akan ditampilkan di sini -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>Tentang Kami</h4>
                <p>Toko online terpercaya menjual makanan dan snack berkualitas</p>
            </div>
            <div class="footer-section">
                <h4>Kontak</h4>
                <p>📞 <a href="https://wa.me/6282338516014" target="_blank">0823-3851-6014</a></p>
            </div>
            <div class="footer-section">
                <h4>Ikuti Kami</h4>
                <p>
                    <a href="https://instagram.com/3gmomskitchen" target="_blank">📱 Instagram</a>
                </p>
            </div>
        </div>
        <p class="footer-bottom">&copy; 2026 3Grecep Store. Semua hak dilindungi.</p>
    </footer>

    <script src="main.js"></script>
    <script src="products.js"></script>
</body>
</html>
